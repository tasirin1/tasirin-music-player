name: Build Tasirin Musik Player APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform 34)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Build signed release APK (jika secret signing tersedia)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ./gradlew --no-daemon :app:assembleRelease \
            -PstoreFile=keystore.jks \
            -PstorePassword="$KEYSTORE_PASSWORD" \
            -PkeyAlias="$KEY_ALIAS" \
            -PkeyPassword="$KEY_PASSWORD"

      - name: Publish GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk -name '*release*.apk' | head -1)
          cp "$APK" tasirin-music-player.apk
          sha256sum tasirin-music-player.apk > tasirin-music-player.apk.sha256
          ls -lh tasirin-music-player.apk
          gh release create "${{ github.ref_name }}" tasirin-music-player.apk tasirin-music-player.apk.sha256 \
            --title "Tasirin Musik Player ${{ github.ref_name }}" \
            --notes "APK ditandatangani keystore tasirin. Android 5.0+ / TV, remote web dari HP."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: tasirin-music-player-apk
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
