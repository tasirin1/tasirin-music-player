name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK + NDK
      run: |
        curl -sLo /tmp/tools.zip \
          https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        export ANDROID_SDK_ROOT=/opt/android
        sudo mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        unzip -q /tmp/tools.zip -d /tmp/
        sudo mv /tmp/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest/
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" > /dev/null 2>&1
        echo "ANDROID_SDK_ROOT=/opt/android" >> $GITHUB_ENV
        echo "ANDROID_HOME=/opt/android" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=/opt/android/ndk/26.3.11579264" >> $GITHUB_ENV

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi

    - name: Install cargo-ndk
      run: cargo install cargo-ndk --locked

    - name: Build inti Rust (JNI .so)
      run: |
        cargo ndk -t arm64-v8a -t armeabi-v7a \
          -o app/src/main/jniLibs build --release \
          --manifest-path rust/music-core/Cargo.toml

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: 8.9

    - name: Build & test APK release (keystore resmi Tasirin)
      env:
        ANDROID_SDK_ROOT: /opt/android
        ANDROID_HOME: /opt/android
        KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
        gradle testDebugUnitTest assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v6
      with:
        name: TasirinMusik-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    - name: Publish GitHub Release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        CODE=${GITHUB_RUN_NUMBER}
        OUT="tasirin-musik-v1.0-${CODE}.apk"
        cp app/build/outputs/apk/release/app-release.apk "$OUT"
        sha256sum "$OUT" > "$OUT.sha256"
        gh release delete "v1.0" --yes --cleanup-tag || true
        gh release create "v1.0" "$OUT" "$OUT.sha256" \
          --title "Tasirin Musik v1.0 (build ${CODE})" \
          --notes "Pemutar musik lokal dengan inti Rust, picker folder sistem (SAF). APK ditandatangani keystore resmi Tasirin — update-over-install mulus." \
          --latest
