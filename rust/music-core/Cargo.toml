[package]
name = "music-core"
version = "1.0.0"
edition = "2021"
description = "Inti Rust pemutar musik: pemindai pustaka, metadata, dan album art via JNI"

[lib]
name = "musiccore"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
lofty = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# APK sekecil mungkin: optimasi ukuran + LTO + buang simbol.
# panic tetap "unwind" karena lib.rs memakai catch_unwind (JNI safety).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
